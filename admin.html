<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — Trira Library</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #f8fafc;">
  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
        <div style="width: 2.2rem; height: 2.2rem; background: var(--teal); color: #fff; display: grid; place-items: center; border-radius: 0.5rem; font-weight: 800; font-size: 1.1rem; font-family: var(--font-heading);">T</div>
        <div style="font-size: 1.3rem; font-weight: 800; color: var(--teal); font-family: var(--font-heading);">Trira <span style="font-weight: 600; font-size: 0.85rem; color: var(--ink-soft);">Admin</span></div>
      </a>
      <nav class="nav">
        <a href="index.html" target="_blank">View Store ↗</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 1000px;">
      <h1 style="font-family: var(--font-heading); font-size: 2rem; color: var(--teal-dark); margin-bottom: 2rem;">Admin Dashboard</h1>

      <!-- Tabs Navigation -->
      <div style="display: flex; gap: 1rem; border-bottom: 2px solid var(--line); margin-bottom: 2rem; flex-wrap: wrap;">
        <button type="button" class="admin-tab-btn is-active" onclick="switchTab('books')" style="padding: 0.75rem 1.5rem; background: none; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--teal); border-bottom: 3px solid var(--teal); margin-bottom: -2px;">Books & PDFs</button>
        <button type="button" class="admin-tab-btn" onclick="switchTab('categories')" style="padding: 0.75rem 1.5rem; background: none; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--ink-soft);">Categories Management</button>
        <button type="button" class="admin-tab-btn" onclick="switchTab('orders')" style="padding: 0.75rem 1.5rem; background: none; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--ink-soft);">Customer Orders</button>
      </div>

      <!-- Tab 1: Books Management -->
      <div id="tabBooks" class="admin-tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h3 style="font-family: var(--font-heading); font-size: 1.3rem;">Manage Store Books & PDF Files</h3>
          <button type="button" class="btn btn--primary" onclick="openBookModal()">+ Add New Book</button>
        </div>
        <div id="adminBooksList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      </div>

      <!-- Tab 2: Categories Management -->
      <div id="tabCategories" class="admin-tab-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h3 style="font-family: var(--font-heading); font-size: 1.3rem;">Manage Book Categories (Arabic & English)</h3>
          <button type="button" class="btn btn--primary" onclick="openCategoryModal()">+ Add New Category</button>
        </div>
        <div id="adminCategoriesList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      </div>

      <!-- Tab 3: Orders Management -->
      <div id="tabOrders" class="admin-tab-content" style="display: none;">
        <h3 style="font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 1.5rem;">Customer Purchase Requests & Payments</h3>
        <div id="adminOrdersList" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      </div>
    </div>
  </main>

  <!-- Book Modal (Add/Edit) -->
  <div id="bookModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1200; place-items:center; padding:1rem;">
    <div style="background:#fff; width:100%; max-width:600px; border-radius:1rem; padding:2rem; max-height:90vh; overflow-y:auto; position:relative;">
      <button type="button" onclick="closeBookModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
      <h3 id="bookModalTitle" style="font-family:var(--font-heading); font-size:1.4rem; color:var(--teal-dark); margin-bottom:1.5rem;">Add New Book</h3>
      <form id="bookForm" onsubmit="handleSaveBook(event)" style="display:flex; flex-direction:column; gap:1rem;">
        <input type="hidden" id="bookId">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Book Title</label>
          <input type="text" id="bookTitle" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;">
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Price (EGP)</label>
            <input type="number" id="bookPrice" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;">
          </div>
          <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Language</label>
            <select id="bookLang" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem; background:#fff;">
              <option value="en">English</option>
              <option value="ar">العربية</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Category</label>
            <select id="bookCategorySelect" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem; background:#fff;">
              <!-- Dynamic Categories -->
            </select>
          </div>
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Cover Image (Browse)</label>
          <input type="file" id="bookImageFile" accept="image/*" style="width:100%; padding:0.5rem; border:1px solid var(--line); border-radius:0.5rem; background:#f8fafc;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">PDF File (Browse)</label>
          <input type="file" id="bookPdfFile" accept=".pdf" style="width:100%; padding:0.5rem; border:1px solid var(--line); border-radius:0.5rem; background:#f8fafc;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Introduction / Summary</label>
          <textarea id="bookIntro" rows="2" style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;"></textarea>
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Full Description</label>
          <textarea id="bookDesc" rows="3" style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;"></textarea>
        </div>
        <button type="submit" class="btn btn--primary" style="margin-top:1rem;">Save Book</button>
      </form>
    </div>
  </div>

  <!-- Category Modal (Add/Edit) -->
  <div id="categoryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1200; place-items:center; padding:1rem;">
    <div style="background:#fff; width:100%; max-width:450px; border-radius:1rem; padding:2rem; position:relative;">
      <button type="button" onclick="closeCategoryModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
      <h3 id="categoryModalTitle" style="font-family:var(--font-heading); font-size:1.3rem; color:var(--teal-dark); margin-bottom:1.5rem;">Add Category</h3>
      <form id="categoryForm" onsubmit="handleSaveCategory(event)" style="display:flex; flex-direction:column; gap:1rem;">
        <input type="hidden" id="catOriginalId">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Category ID (English Key, e.g. Business)</label>
          <input type="text" id="catIdKey" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;" placeholder="Business">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Arabic Name (اسم الفئة بالعربي)</label>
          <input type="text" id="catNameAr" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;" placeholder="إدارة الأعمال">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">English Name (Category Name in English)</label>
          <input type="text" id="catNameEn" required style="width:100%; padding:0.75rem; border:1px solid var(--line); border-radius:0.5rem;" placeholder="Business">
        </div>
        <button type="submit" class="btn btn--primary" style="margin-top:1rem;">Save Category</button>
      </form>
    </div>
  </div>

  <script src="js/data.js?v=3.1"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderAdminBooks();
      renderAdminCategories();
      renderAdminOrders();
    });

    function switchTab(tab) {
      document.getElementById("tabBooks").style.display = tab === 'books' ? 'block' : 'none';
      document.getElementById("tabCategories").style.display = tab === 'categories' ? 'block' : 'none';
      document.getElementById("tabOrders").style.display = tab === 'orders' ? 'block' : 'none';
      
      const btns = document.querySelectorAll(".admin-tab-btn");
      btns.forEach((b, idx) => {
        const active = (idx === 0 && tab === 'books') || (idx === 1 && tab === 'categories') || (idx === 2 && tab === 'orders');
        b.style.color = active ? "var(--teal)" : "var(--ink-soft)";
        b.style.borderBottom = active ? "3px solid var(--teal)" : "none";
      });

      if (tab === 'books') renderAdminBooks();
      if (tab === 'categories') renderAdminCategories();
      if (tab === 'orders') renderAdminOrders();
    }

    // إدارة الكتب
    function renderAdminBooks() {
      const container = document.getElementById("adminBooksList");
      const books = typeof getProducts === "function" ? getProducts() : [];

      if (books.length === 0) {
        container.innerHTML = `<p style="color:var(--ink-soft);">No books found.</p>`;
        return;
      }

      container.innerHTML = books.map(b => `
        <div style="background:#fff; border:1px solid var(--line); border-radius:0.75rem; padding:1.25rem; display:flex; justify-content:space-between; align-items:center; gap:1rem;">
          <div style="display:flex; gap:1rem; align-items:center;">
            <img src="${b.image}" alt="${b.title}" style="width:3rem; height:4rem; object-fit:cover; border-radius:0.4rem; border:1px solid var(--line);">
            <div>
              <h4 style="font-family:var(--font-heading); font-size:1.05rem; margin-bottom:0.2rem;">${b.title}</h4>
              <p style="font-size:0.85rem; color:var(--teal); font-weight:700;">${b.price} EGP | Lang: <span style="text-transform:uppercase;">${b.lang}</span> | Cat: ${b.category}</p>
            </div>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button type="button" class="btn btn--ghost" onclick="editBook(${b.id})" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Edit</button>
            <button type="button" class="btn btn--ghost" onclick="deleteBook(${b.id})" style="padding:0.4rem 0.8rem; font-size:0.85rem; color:#ef4444; border-color:#fca5a5;">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function populateCategoryDropdown(selectedCat = "") {
      const select = document.getElementById("bookCategorySelect");
      const cats = getCategories();
      select.innerHTML = cats.map(c => `
        <option value="${c.id}" ${c.id === selectedCat ? 'selected' : ''}>${c.ar} / ${c.en}</option>
      `).join("");
    }

    function openBookModal(book = null) {
      populateCategoryDropdown(book ? book.category : "");
      const modal = document.getElementById("bookModal");
      modal.style.display = "grid";
      if (book) {
        document.getElementById("bookModalTitle").textContent = "Edit Book";
        document.getElementById("bookId").value = book.id;
        document.getElementById("bookTitle").value = book.title;
        document.getElementById("bookPrice").value = book.price;
        document.getElementById("bookLang").value = book.lang || "en";
        document.getElementById("bookCategorySelect").value = book.category || "";
        document.getElementById("bookIntro").value = book.introduction || "";
        document.getElementById("bookDesc").value = book.description || "";
        document.getElementById("bookImageFile").value = "";
        document.getElementById("bookPdfFile").value = "";
      } else {
        document.getElementById("bookModalTitle").textContent = "Add New Book";
        document.getElementById("bookForm").reset();
        document.getElementById("bookId").value = "";
      }
    }

    function closeBookModal() { document.getElementById("bookModal").style.display = "none"; }
    function editBook(id) { const book = getProducts().find(b => b.id == id); if (book) openBookModal(book); }
    function deleteBook(id) {
      if (!confirm("Delete this book?")) return;
      let books = getProducts().filter(b => b.id != id);
      saveProducts(books);
      renderAdminBooks();
    }

    function handleSaveBook(e) {
      e.preventDefault();
      const id = document.getElementById("bookId").value;
      const title = document.getElementById("bookTitle").value;
      const price = parseFloat(document.getElementById("bookPrice").value);
      const lang = document.getElementById("bookLang").value;
      const category = document.getElementById("bookCategorySelect").value;
      const introduction = document.getElementById("bookIntro").value;
      const description = document.getElementById("bookDesc").value;

      const imageFile = document.getElementById("bookImageFile").files[0];
      const pdfFile = document.getElementById("bookPdfFile").files[0];

      let books = getProducts();
      let existingBook = id ? books.find(b => b.id == id) : null;
      let imagePath = existingBook ? existingBook.image : "images/products/p1.jpg";
      let pdfPath = existingBook ? existingBook.downloadLink : "#";

      const processFiles = (finalImg, finalPdf) => {
        if (id) {
          books = books.map(b => b.id == id ? { ...b, title, price, lang, category, image: finalImg, downloadLink: finalPdf, introduction, description } : b);
        } else {
          books.push({ id: Date.now(), title, price, lang, category, image: finalImg, downloadLink: finalPdf, introduction, description });
        }
        saveProducts(books);
        closeBookModal();
        renderAdminBooks();
      };

      const handlePdf = (imgRes) => {
        if (pdfFile) {
          const r = new FileReader();
          r.onload = (ev) => processFiles(imgRes, ev.target.result);
          r.readAsDataURL(pdfFile);
        } else {
          processFiles(imgRes, pdfPath);
        }
      };

      if (imageFile) {
        const r = new FileReader();
        r.onload = (ev) => handlePdf(ev.target.result);
        r.readAsDataURL(imageFile);
      } else {
        handlePdf(imagePath);
      }
    }

    // إدارة الفئات (Categories Management)
    function renderAdminCategories() {
      const container = document.getElementById("adminCategoriesList");
      const cats = getCategories();

      container.innerHTML = cats.map(c => `
        <div style="background:#fff; border:1px solid var(--line); border-radius:0.75rem; padding:1.25rem; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h4 style="font-family:var(--font-heading); font-size:1.05rem; margin-bottom:0.2rem;">${c.ar} / ${c.en}</h4>
            <p style="font-size:0.85rem; color:var(--ink-soft);">Key ID: <code>${c.id}</code></p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button type="button" class="btn btn--ghost" onclick="editCategory('${c.id}')" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Edit</button>
            <button type="button" class="btn btn--ghost" onclick="deleteCategory('${c.id}')" style="padding:0.4rem 0.8rem; font-size:0.85rem; color:#ef4444; border-color:#fca5a5;">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function openCategoryModal(cat = null) {
      const modal = document.getElementById("categoryModal");
      modal.style.display = "grid";
      if (cat) {
        document.getElementById("categoryModalTitle").textContent = "Edit Category";
        document.getElementById("catOriginalId").value = cat.id;
        document.getElementById("catIdKey").value = cat.id;
        document.getElementById("catNameAr").value = cat.ar;
        document.getElementById("catNameEn").value = cat.en;
      } else {
        document.getElementById("categoryModalTitle").textContent = "Add Category";
        document.getElementById("categoryForm").reset();
        document.getElementById("catOriginalId").value = "";
      }
    }

    function closeCategoryModal() { document.getElementById("categoryModal").style.display = "none"; }
    function editCategory(id) { const cat = getCategories().find(c => c.id === id); if (cat) openCategoryModal(cat); }

    function deleteCategory(id) {
      const books = getProducts();
      const inUse = books.some(b => b.category === id);
      if (inUse) {
        alert("Cannot delete this category because it is currently assigned to one or more books!");
        return;
      }
      if (!confirm("Are you sure you want to delete this category?")) return;

      let cats = getCategories().filter(c => c.id !== id);
      saveCategories(cats);
      renderAdminCategories();
    }

    function handleSaveCategory(e) {
      e.preventDefault();
      const origId = document.getElementById("catOriginalId").value;
      const idKey = document.getElementById("catIdKey").value.trim();
      const arName = document.getElementById("catNameAr").value.trim();
      const enName = document.getElementById("catNameEn").value.trim();

      let cats = getCategories();
      if (origId) {
        cats = cats.map(c => c.id === origId ? { id: idKey, ar: arName, en: enName } : c);
      } else {
        if (cats.some(c => c.id === idKey)) {
          alert("Category ID already exists!");
          return;
        }
        cats.push({ id: idKey, ar: arName, en: enName });
      }

      saveCategories(cats);
      closeCategoryModal();
      renderAdminCategories();
    }

    function renderAdminOrders() {
      const container = document.getElementById("adminOrdersList");
      const orders = typeof getOrders === "function" ? getOrders() : [];
      if (orders.length === 0) {
        container.innerHTML = `<p style="color:var(--ink-soft);">No customer orders yet.</p>`;
        return;
      }
      container.innerHTML = orders.map(o => `
        <div style="background:#fff; border:1px solid var(--line); border-radius:0.75rem; padding:1.25rem;">
          <span style="font-weight:700; color:var(--teal-dark);">${o.id}</span> - Customer: <strong>${o.customer.name}</strong> (${o.total} EGP)
        </div>
      `).join("");
    }
  </script>
</body>
</html>
