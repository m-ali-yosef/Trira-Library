<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles — Trira Library</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
        <div style="width: 2.2rem; height: 2.2rem; background: var(--teal); color: #fff; display: grid; place-items: center; border-radius: 0.5rem; font-weight: 800; font-size: 1.1rem; font-family: var(--font-heading);">T</div>
        <div style="font-size: 1.3rem; font-weight: 800; color: var(--teal); font-family: var(--font-heading);">Trira <span style="font-weight: 600; font-size: 0.85rem; color: var(--ink-soft);">Library</span></div>
      </a>
      <nav class="nav">
        <a href="index.html">Store</a>
        <a href="articles.html" class="is-active">Articles</a>
        <a href="about.html">About Us</a>
      </nav>
      <div class="header__actions">
        <button type="button" class="icon-btn" data-cart-toggle aria-label="Open cart">
          🛒 <span class="cart-count" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <header class="page-hero" style="text-align: center; margin-bottom: 2.5rem;">
        <h1>Articles & Reading Insights</h1>
        <p>Explore expert tips, book reviews, and strategies to accelerate your professional growth.</p>
      </header>

      <!-- Articles Grid -->
      <div id="articlesGrid" style="max-width: 800px; margin: 0 auto;">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping Cart" aria-hidden="true">
    <div class="cart-drawer__head">
      <h3>Your Cart</h3>
      <button type="button" class="icon-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-drawer__list" id="cartList"></div>
    <div class="cart-drawer__foot" id="cartFoot" style="display: none;">
      <div class="cart-total">
        <span>Subtotal</span>
        <span id="cartTotal">0 EGP</span>
      </div>
      <button type="button" class="btn btn--primary" id="checkoutBtn">Place Order & Send Request</button>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="footer">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <p>© 2026 Trira. All rights reserved.</p>
        <p style="font-size: 0.85rem; margin-top: 0.25rem;">Phone: <span data-footer-phone></span> | Email: <span data-footer-email></span></p>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <a data-social-fb href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">Facebook</a>
        <a data-social-ig href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">Instagram</a>
        <a data-social-tt href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">TikTok</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js?v=2.0"></script>
  <script src="js/main.js?v=2.0"></script>
  <script>
    // عرض المقالات مع ضمان استخدام الصورة الجديدة المحدثة
    (function() {
      const grid = document.getElementById("articlesGrid");
      if (!grid) return;

      const articles = typeof getArticles === "function" ? getArticles() : [];
      
      if (articles.length === 0) {
        grid.innerHTML = `<p style="text-align:center; color:var(--ink-soft);">No articles available.</p>`;
        return;
      }

      const defaultImg = "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=800&q=75";

      grid.innerHTML = articles.map(art => `
        <article class="product-card" style="margin-bottom: 2rem;">
          <a href="article.html?id=${art.id}" class="product-card__media" style="height: 18rem;">
            <img src="${art.image && !art.image.includes('photo-1514432324607') ? art.image : defaultImg}" alt="${art.title}" loading="lazy" style="width:100%; height:100%; object-fit:cover;">
          </a>
          <div class="product-card__body" style="padding: 2rem;">
            <span class="badge" style="margin-bottom: 0.75rem; display: inline-block;">${art.readTime || '4 min read'}</span>
            <h3 style="font-size: 1.5rem; margin-bottom: 0.75rem;"><a href="article.html?id=${art.id}" style="color:inherit; text-decoration:none;">${art.title}</a></h3>
            <p style="color: var(--ink-soft); margin-bottom: 1.5rem; line-height: 1.6;">${art.excerpt || ''}</p>
            <a href="article.html?id=${art.id}" class="btn btn--ghost" style="width: 100%; text-align: center;">Read Article</a>
          </div>
        </article>
      `).join("");
    })();
  </script>
</body>
</html>
