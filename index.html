<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trira — Professional Digital PDF Library</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
        <div style="width: 2.2rem; height: 2.2rem; background: var(--teal); color: #fff; display: grid; place-items: center; border-radius: 0.5rem; font-weight: 800; font-size: 1.1rem; font-family: var(--font-heading);">T</div>
        <div style="font-size: 1.3rem; font-weight: 800; color: var(--teal); font-family: var(--font-heading);">Trira <span style="font-weight: 600; font-size: 0.85rem; color: var(--ink-soft);">Library</span></div>
      </a>
      <nav class="nav">
        <a href="index.html" class="is-active">Store</a>
        <a href="articles.html">Articles</a>
        <a href="about.html">About Us</a>
      </nav>
      <div class="header__actions">
        <button type="button" class="icon-btn" data-cart-toggle aria-label="Open cart">
          🛒 <span class="cart-count" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <header class="page-hero" style="text-align: center; margin-bottom: 2rem;">
        <h1>Trira Professional PDF Library</h1>
        <p>Choose your preferred language section to browse available professional books and guides.</p>
        
        <!-- Language Switcher Tabs -->
        <div class="filters" style="justify-content: center; margin-top: 1.5rem; display: flex; gap: 0.5rem;">
          <button type="button" class="filter-btn is-active" id="btnAr" onclick="switchLang('ar', this)" style="padding: 0.6rem 1.5rem; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--teal); color: #fff;">الكتب العربية (Arabic Books)</button>
          <button type="button" class="filter-btn" id="btnEn" onclick="switchLang('en', this)" style="padding: 0.6rem 1.5rem; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);">English Books</button>
        </div>
      </header>

      <!-- Books Grid -->
      <div class="grid grid--3" id="booksGrid">
        <!-- Books rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping Cart" aria-hidden="true">
    <div class="cart-drawer__head">
      <h3>Your Cart</h3>
      <button type="button" class="icon-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-drawer__list" id="cartList"></div>
    <div class="cart-drawer__foot" id="cartFoot" style="display: none;">
      <div class="cart-total">
        <span>Subtotal</span>
        <span id="cartTotal">0 EGP</span>
      </div>
      <button type="button" class="btn btn--primary" id="checkoutBtn">Place Order & Send Request</button>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="footer">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <p>© 2026 Trira. All rights reserved.</p>
        <p style="font-size: 0.85rem; margin-top: 0.25rem;">Phone: <span data-footer-phone></span> | Email: <span data-footer-email></span></p>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <a data-social-fb href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">Facebook</a>
        <a data-social-ig href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">Instagram</a>
        <a data-social-tt href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">TikTok</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    function switchLang(lang, btn) {
      document.querySelectorAll(".filter-btn").forEach(b => {
        b.classList.remove("is-active");
        b.style.background = "#fff";
        b.style.color = "var(--ink)";
      });
      if (btn) {
        btn.classList.add("is-active");
        btn.style.background = "var(--teal)";
        btn.style.color = "#fff";
      }
      if (typeof window.renderBooksByLang === "function") {
        window.renderBooksByLang(lang);
      }
    }
  </script>
</body>
</html>
