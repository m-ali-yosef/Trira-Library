<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details — Trira Library</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
        <div style="width: 2.2rem; height: 2.2rem; background: var(--teal); color: #fff; display: grid; place-items: center; border-radius: 0.5rem; font-weight: 800; font-size: 1.1rem; font-family: var(--font-heading);">T</div>
        <div style="font-size: 1.3rem; font-weight: 800; color: var(--teal); font-family: var(--font-heading);">Trira <span style="font-weight: 600; font-size: 0.85rem; color: var(--ink-soft);">Library</span></div>
      </a>
      <nav class="nav">
        <a href="index.html">Store</a>
        <a href="articles.html">Articles</a>
        <a href="about.html">About Us</a>
      </nav>
      <div class="header__actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <button type="button" class="btn btn--ghost" onclick="showMyOrdersModal()" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">📦 My Orders</button>
        <button type="button" class="icon-btn" data-cart-toggle aria-label="Open cart">
          🛒 <span class="cart-count" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 900px;">
      <div style="margin-bottom: 1.5rem;">
        <a href="index.html" class="btn btn--ghost" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.9rem;">
          ← Back to Books
        </a>
      </div>

      <div id="bookDetailsContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Shopping Cart" aria-hidden="true">
    <div class="cart-drawer__head">
      <h3>Your Cart</h3>
      <button type="button" class="icon-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-drawer__list" id="cartList"></div>
    <div class="cart-drawer__foot" id="cartFoot" style="display: none;">
      <div class="cart-total">
        <span>Subtotal</span>
        <span id="cartTotal">0 EGP</span>
      </div>
      <button type="button" class="btn btn--primary" id="checkoutBtn">Place Order & Send Request</button>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="footer">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <p>© 2026 Trira. All rights reserved.</p>
        <p style="font-size: 0.85rem; margin-top: 0.25rem;">Phone: <span data-footer-phone></span> | Email: <span data-footer-email></span></p>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <a data-social-fb href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">Facebook</a>
        <a data-social-ig href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">Instagram</a>
        <a data-social-tt href="#" target="_blank" style="color: #94A3B8; text-decoration: none; font-weight: 600;">TikTok</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js?v=2.8"></script>
  <script src="js/main.js?v=2.8"></script>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');
      const books = typeof getProducts === "function" ? getProducts() : [];
      const book = books.find(b => b.id == bookId) || books[0];

      const container = document.getElementById("bookDetailsContainer");
      if (!container || !book) return;

      container.innerHTML = `
        <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap: 2.5rem; align-items: start; background: #fff; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--line);">
          <div style="border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); height: 24rem;">
            <img src="${book.image}" alt="${book.title}" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <div>
            <div style="display:flex; gap: 0.5rem; margin-bottom: 0.75rem;">
              <span class="badge">${book.category || 'General'}</span>
              <span style="font-size:0.75rem; font-weight:700; color:var(--teal); background:#f0fdfa; padding:0.2rem 0.5rem; border-radius:0.3rem;">${book.lang === 'ar' ? 'العربية' : 'English'}</span>
            </div>
            <h1 style="font-family: var(--font-heading); font-size: 2rem; color: var(--teal-dark); margin-bottom: 0.75rem; line-height: 1.3;">${book.title}</h1>
            <p style="font-size: 1.3rem; font-weight: 800; color: var(--teal); margin-bottom: 1.25rem;">${book.price} EGP</p>
            
            <!-- حقل الـ Introduction (المقدمة / Intro) -->
            <div style="background: #f8fafc; padding: 1rem 1.25rem; border-radius: 0.5rem; border-left: 4px solid var(--teal); margin-bottom: 1.25rem;">
              <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--teal-dark); margin-bottom: 0.3rem;">Introduction (Intro):</h4>
              <p style="font-size: 0.95rem; color: var(--ink-soft); line-height: 1.5;">${book.introduction || 'No introduction available.'}</p>
            </div>

            <!-- حقل الـ Description (الوصف الكامل) -->
            <div style="color: var(--ink); font-size: 1rem; line-height: 1.7; margin-bottom: 2rem;">
              <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--teal-dark); margin-bottom: 0.3rem;">Full Description:</h4>
              <p>${book.description || 'No description available.'}</p>
            </div>

            <button type="button" class="btn btn--primary" onclick="addToCart(${book.id})" style="padding: 0.75rem 2rem; font-size: 1rem; width: 100%;">Add to Cart 🛒</button>
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
